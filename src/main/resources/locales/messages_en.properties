# Errors

errors.dao.data-integrity-violation              = The operation failed due to a data integrity violation. Please ensure that all related data is valid and try again.
errors.dao.duplicate-key                         = We were unable to save the information due to a duplicate entry. Please make sure the value is unique.
errors.dao.locking-failed                        = The data you are trying to modify has been changed by someone else. Please refresh your data and try again.
errors.common.internal                           = An internal error has occurred.
errors.validation.constraint-violation           = One or more fields do not meet the required criteria. Please check the highlighted fields and try again.
errors.validation.missing-request-part           = A required part of the request is missing. Please ensure all required data is included and try again.
errors.validation.missing-request-parameter      = A required parameter is missing from the request. Please ensure all required parameters are included and try again.
errors.validation.illegal-state                  = The request contains an illegal state. Please check your request and try again.
errors.validation.method-argument-type-mismatch  = One or more parameters have an invalid type. Please check the parameter types and try again.


# Auth

auth.errors.username-not-found                   = We couldn't find an account with that username. Please check and try again.
auth.errors.permission-denied                    = You don't have permission to access this resource. Please contact your administrator if you believe this is an error.
auth.errors.account-expired                      = Your account has expired. Please contact support to reactivate it.
auth.errors.credentials-expired                  = Your password has expired. Please reset your password to continue.
auth.errors.bad-credentials                      = Oops! The username or password you entered is incorrect. Please try again.
auth.errors.authentication-credentials-not-found = We couldn't verify your login details. Please sign in again.
auth.errors.account-locked                       = Your account has been locked due to multiple failed login attempts. Please contact support.
auth.errors.account-disabled                     = Your account is currently disabled. Please contact support for assistance.
auth.errors.authentication-failed                = Sorry, we couldn't log you in due to a system error. Please try again later.
auth.errors.invalid-or-expired-token             = The provided token is invalid or has expired.
auth.errors.not-authenticated                    = You are not authenticated. Please log in to continue.
auth.errors.access-denied                        = You do not have permission to access this resource.


# Uploads

uploads.errors.path-traversal-detected           = The requested file path is invalid or contains unsafe characters. Please check the file path and try again.
uploads.errors.file-not-found                    = The requested file could not be found. Please verify the file exists and try again.
uploads.errors.file-deletion-failed              = We couldn't delete the file due to a system error. Please try again or contact support if the problem persists.
uploads.errors.file-empty                        = The uploaded file is empty. Please select a valid file and try again.
uploads.errors.file-invalid-name                 = The file name contains invalid characters. Please rename the file and try again.
uploads.errors.file-too-large                    = The file is too large to upload. Please choose a smaller file (maximum 200MB) and try again.
uploads.errors.file-type-not-allowed             = The file type is not supported. Please upload a supported file type (PDF, DOC, DOCX, TXT, RTF, ODT, JPG, JPEG, PNG, GIF, BMP, TIFF, MP4, AVI, MOV, WMV, FLV, WEBM).


# Documents

documents.errors.not-found                       = The requested document could not be found. Please verify the type exists and try again.
documents.errors.type-not-found                  = The requested document type could not be found. Please verify the type exists and try again.
documents.errors.types-fetch-failed              = We couldn't retrieve the document types due to a system error. Please try again later.
documents.errors.type-code-already-exists        = A document type with this code already exists. Please choose a different code and try again.
documents.errors.type-creation-failed            = We couldn't create the document type due to a system error. Please try again later.
documents.errors.type-update-failed              = We couldn't update the document type due to a system error. Please try again later.
documents.errors.type-patch-failed               = We couldn't update the document type due to a system error. Please try again later.
documents.errors.type-deletion-failed            = We couldn't delete the document type due to a system error. Please try again later.
documents.errors.type-code-required              = The document type code is required. Please provide a code and try again.
documents.errors.type-code-too-short             = The document type code is too short. Please provide a code with at least 2 characters and try again.
documents.errors.type-name-too-short             = The document type name is too short. Please provide a name with at least 2 characters and try again.
documents.errors.type-already-active             = The document type is already active. No changes were made.
documents.errors.type-already-inactive           = The document type is already inactive. No changes were made.
documents.errors.type-not-active                 = The document type is not active. Please activate the document type first.
documents.errors.type-not-deleted                = The document type is not deleted. This operation is only valid for deleted document types.
documents.errors.type-has-dependencies           = The document type cannot be permanently deleted because it has associated documents. The document type has been marked as deleted instead.


# Persons

persons.errors.search-failed                     = We couldn't search for persons due to a system error. Please try again later.
persons.errors.pid-already-exists                = A person with this PID already exists. Please use a different PID and try again.
persons.errors.creation-constraint-violation     = We couldn't create the person due to a data constraint issue. Please check your input and try again.
persons.errors.creation-failed                   = We couldn't create the person due to a system error. Please try again later.
persons.errors.not-found                         = The requested person could not be found. Please verify the person exists and try again.
persons.errors.update-constraint-violation       = We couldn't update the person due to a data constraint issue. Please check your input and try again.
persons.errors.update-failed                     = We couldn't update the person due to a system error. Please try again later.
persons.errors.patch-constraint-violation        = We couldn't update the person due to a data constraint issue. Please check your input and try again.
persons.errors.patch-failed                      = We couldn't update the person due to a system error. Please try again later.
persons.errors.deletion-failed                   = We couldn't delete the person due to a system error. Please try again later.
persons.errors.documents-search-failed           = We couldn't retrieve the person's documents due to a system error. Please try again later.
persons.errors.pid-required                      = The person's PID is required. Please provide a PID and try again.
persons.errors.name-required                     = The person's name is required. Please provide a name and try again.
persons.errors.name-too-short                    = The person's name is too short. Please provide a name with at least 2 characters and try again.
persons.errors.already-active                    = The person is already active. No changes were made.
persons.errors.already-inactive                  = The person is already inactive. No changes were made.
persons.errors.not-active                        = The person is not active. Please activate the person first.
persons.errors.not-deleted                       = The person is not deleted. This operation is only valid for deleted persons.
persons.errors.has-dependencies                  = The person cannot be permanently deleted because they have associated documents. The person has been marked as deleted instead.
persons.errors.email-invalid                     = The email address provided is invalid. Please provide a valid email address and try again.