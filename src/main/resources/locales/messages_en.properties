# Errors

errors.dao.data-integrity-violation              = Échec de l'opération en raison d'une violation d'intégrité des données. Veuillez vérifier que toutes les données liées sont valides et réessayer.
errors.dao.duplicate-key                         = Nous n'avons pas pu enregistrer l'information en raison d'un doublon. Veuillez vous assurer que la valeur est unique.
errors.dao.locking-failed                        = Les données que vous essayez de modifier ont été modifiées par quelqu'un d'autre. Actualisez vos données et réessayez.
errors.common.internal                           = Une erreur inter ne s'est produite.
errors.validation.constraint-violation           = Un ou plusieurs champs ne répondent pas aux critères requis. Veuillez vérifier les champs surlignés et réessayez.


# Auth

auth.errors.username-not-found                   = We couldn't find an account with that username. Please check and try again.
auth.errors.permission-denied                    = You don't have permission to access this resource. Please contact your administrator if you believe this is an error.
auth.errors.account-expired                      = Your account has expired. Please contact support to reactivate it.
auth.errors.credentials-expired                  = Your password has expired. Please reset your password to continue.
auth.errors.bad-credentials                      = Oops! The username or password you entered is incorrect. Please try again.
auth.errors.authentication-credentials-not-found = We couldn't verify your login details. Please sign in again.
auth.errors.account-locked                       = Your account has been locked due to multiple failed login attempts. Please contact support.
auth.errors.account-disabled                     = Your account is currently disabled. Please contact support for assistance.
auth.errors.authentication-failed                = Sorry, we couldn't log you in due to a system error. Please try again later.
auth.errors.invalid-or-expired-token             = The provided token is invalid or has expired.
auth.errors.not-authenticated                    = You are not authenticated. Please log in to continue.
auth.errors.access-denied                        = You do not have permission to access this resource.