# Core

errors.dao.data-integrity-violation              = Operation failed due to data integrity violation. Please ensure all related data is valid and try again.
errors.dao.duplicate-key                         = We couldn't save the information due to a duplicate entry. Please ensure the value is unique.
errors.dao.locking-failed                        = Data you're trying to modify has been modified by someone else. Refresh your data and try again.
errors.common.internal                           = An internal error occurs
errors.validation.constraint-violation           = One or more fields didn't meet the required criteria. Please check the highlighted fields and try again.


# Auth

auth.errors.username-not-found                   = Aucun compte trouvé avec ce nom d'utilisateur. Veuillez vérifier et réessayer.
auth.errors.permission-denied                    = Vous n'avez pas la permission d'accéder à cette ressource. Veuillez contacter votre administrateur si vous pensez qu'il s'agit d'une erreur.
auth.errors.account-expired                      = Votre compte a expiré. Veuillez contacter le support pour le réactiver.
auth.errors.credentials-expired                  = Votre mot de passe a expiré. Veuillez le réinitialiser pour continuer.
auth.errors.bad-credentials                      = Oups ! Le nom d'utilisateur ou le mot de passe est incorrect. Veuillez réessayer.
auth.errors.authentication-credentials-not-found = Nous n'avons pas pu vérifier vos informations de connexion. Veuillez vous reconnecter.
auth.errors.account-locked                       = Votre compte est verrouillé après plusieurs tentatives échouées. Veuillez contacter le support.
auth.errors.account-disabled                     = Votre compte est désactivé. Veuillez contacter le support pour obtenir de l'aide.
auth.errors.authentication-failed                = Désolé, nous n'avons pas pu vous connecter à cause d'une erreur système. Veuillez réessayer plus tard.
auth.errors.invalid-or-expired-token             = Le token fourni est invalide ou a expiré.
auth.errors.not-authenticated                    = Vous n'êtes pas authentifié. Veuillez vous connecter pour continuer.
auth.errors.access-denied                        = Vous n'avez pas la permission d'accéder à cette ressource.