auth.errors.access-denied                    = Vous n'avez pas la permission d'accéder à cette ressource.


# Uploads

uploads.errors.path-traversal-detected       = Le chemin du fichier demandé est invalide ou contient des caractères dangereux. Veuillez vérifier le chemin du fichier et réessayer.
uploads.errors.file-not-found                = Le fichier demandé n'a pas pu être trouvé. Veuillez vérifier que le fichier existe et réessayer.
uploads.errors.file-deletion-failed          = Nous n'avons pas pu supprimer le fichier en raison d'une erreur système. Veuillez réessayer ou contacter le support si le problème persiste.
uploads.errors.file-empty                    = Le fichier téléchargé est vide. Veuillez sélectionner un fichier valide et réessayer.
uploads.errors.file-invalid-name             = Le nom du fichier contient des caractères invalides. Veuillez renommer le fichier et réessayer.
uploads.errors.file-too-large                = Le fichier est trop volumineux pour être téléchargé. Veuillez choisir un fichier plus petit (maximum 200MB) et réessayer.
uploads.errors.file-type-not-allowed         = Le type de fichier n'est pas pris en charge. Veuillez télécharger un type de fichier pris en charge (PDF, DOC, DOCX, TXT, RTF, ODT, JPG, JPEG, PNG, GIF, BMP, TIFF, MP4, AVI, MOV, WMV, FLV, WEBM).


# Documents

documents.errors.not-found                   = Le document demandé n'a pas pu être trouvé. Veuillez vérifier que le type existe et réessayer.
documents.errors.types-fetch-failed          = Nous n'avons pas pu récupérer les types de documents en raison d'une erreur système. Veuillez réessayer plus tard.
documents.errors.type-code-already-exists    = Un type de document avec ce code existe déjà. Veuillez choisir un code différent et réessayer.
documents.errors.type-creation-failed        = Nous n'avons pas pu créer le type de document en raison d'une erreur système. Veuillez réessayer plus tard.
documents.errors.type-update-failed          = Nous n'avons pas pu mettre à jour le type de document en raison d'une erreur système. Veuillez réessayer plus tard.
documents.errors.type-patch-failed           = Nous n'avons pas pu mettre à jour le type de document en raison d'une erreur système. Veuillez réessayer plus tard.
documents.errors.type-deletion-failed        = Nous n'avons pas pu supprimer le type de document en raison d'une erreur système. Veuillez réessayer plus tard.
documents.errors.type-code-required          = Le code du type de document est requis. Veuillez fournir un code et réessayer.
documents.errors.type-code-too-short         = Le code du type de document est trop court. Veuillez fournir un code d'au moins 2 caractères et réessayer.
documents.errors.type-name-too-short         = Le nom du type de document est trop court. Veuillez fournir un nom d'au moins 2 caractères et réessayer.
documents.errors.type-already-active         = Le type de document est déjà actif. Aucune modification n'a été apportée.
documents.errors.type-already-inactive       = Le type de document est déjà inactif. Aucune modification n'a été apportée.
documents.errors.type-not-active             = Le type de document n'est pas actif. Veuillez d'abord activer le type de document.
documents.errors.type-not-deleted            = Le type de document n'est pas supprimé. Cette opération n'est valide que pour les types de documents supprimés.
documents.errors.type-has-dependencies       = Le type de document ne peut pas être supprimé définitivement car il a des documents associés. Le type de document a été marqué comme supprimé à la place.


# Persons

persons.errors.search-failed                 = Nous n'avons pas pu rechercher des personnes en raison d'une erreur système. Veuillez réessayer plus tard.
persons.errors.pid-already-exists            = Une personne avec ce PID existe déjà. Veuillez utiliser un PID différent et réessayer.
persons.errors.creation-constraint-violation = Nous n'avons pas pu créer la personne en raison d'un problème de contrainte de données. Veuillez vérifier vos données et réessayer.
persons.errors.creation-failed               = Nous n'avons pas pu créer la personne en raison d'une erreur système. Veuillez réessayer plus tard.
persons.errors.not-found                     = La personne demandée n'a pas pu être trouvée. Veuillez vérifier que la personne existe et réessayer.
persons.errors.update-constraint-violation   = Nous n'avons pas pu mettre à jour la personne en raison d'un problème de contrainte de données. Veuillez vérifier vos données et réessayer.
persons.errors.update-failed                 = Nous n'avons pas pu mettre à jour la personne en raison d'une erreur système. Veuillez réessayer plus tard.
persons.errors.patch-constraint-violation    = Nous n'avons pas pu mettre à jour la personne en raison d'un problème de contrainte de données. Veuillez vérifier vos données et réessayer.
persons.errors.patch-failed                  = Nous n'avons pas pu mettre à jour la personne en raison d'une erreur système. Veuillez réessayer plus tard.
persons.errors.deletion-failed               = Nous n'avons pas pu supprimer la personne en raison d'une erreur système. Veuillez réessayer plus tard.
persons.errors.documents-search-failed       = Nous n'avons pas pu récupérer les documents de la personne en raison d'une erreur système. Veuillez réessayer plus tard.
persons.errors.pid-required                  = Le PID de la personne est requis. Veuillez fournir un PID et réessayer.
persons.errors.name-required                 = Le nom de la personne est requis. Veuillez fournir un nom et réessayer.
persons.errors.name-too-short                = Le nom de la personne est trop court. Veuillez fournir un nom d'au moins 2 caractères et réessayer.
persons.errors.already-active                = La personne est déjà active. Aucune modification n'a été apportée.
persons.errors.already-inactive              = La personne est déjà inactive. Aucune modification n'a été apportée.
persons.errors.not-active                    = La personne n'est pas active. Veuillez d'abord activer la personne.
persons.errors.not-deleted                   = La personne n'est pas supprimée. Cette opération n'est valide que pour les personnes supprimées.
persons.errors.has-dependencies              = La personne ne peut pas être supprimée définitivement car elle a des documents associés. La personne a été marquée comme supprimée à la place.
