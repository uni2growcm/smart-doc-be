spring.application.name                   = smartdoc
spring.mvc.servlet.path                   = /api
spring.profiles.active                    = ${SPRING_PROFILE:default}

# Server
server.port                               = ${PORT:8080}

# Virtual Threads
spring.threads.virtual.enabled            = true

# Multipart
spring.servlet.multipart.enabled          = true
spring.servlet.multipart.max-file-size    = ${MAX_FILE_SIZE:200}MB
spring.servlet.multipart.max-request-size = ${MAX_REQUEST_SIZE:210}MB

# Datasource
spring.datasource.url                     = jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${DB_NAME:smartdoc}?createDatabaseIfNotExist=true
spring.datasource.username                = ${DB_USER:user}
spring.datasource.password                = ${DB_PASSWORD:password}
spring.datasource.driver-class-name       = com.mysql.cj.jdbc.Driver
spring.jpa.properties.hibernate.dialect   = org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto             = none

# Show only important logs
logging.level.root                        = INFO

# Uploads
uploads.paths.base-dir                    = ${UPLOADS_BASE_DIR:~/opt/smartdoc/uploads}
uploads.paths.videos                      = videos
uploads.paths.images                      = images
uploads.paths.documents                   = documents
uploads.storage.max-items                 = 1000
uploads.storage.max-file-size             = ${MAX_FILE_SIZE:200}
