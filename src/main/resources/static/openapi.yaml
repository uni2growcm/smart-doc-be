openapi: 3.0.0
info:
  title: SmartDoc Document Management API
  description: API for managing person-related documents stored in a file system, and for serving SmartDoc UI plugin resources. Designed to be accessed via the OH-API proxy in integrated mode.
  version: 1.1.0
servers:
  - url: https://example.com/api
tags:
  - name: Documents
    description: Operations related to document upload, retrieval, and deletion.
  - name: Persons
    description: Operations related to person identification.
  - name: System
    description: General system information and metadata.

paths:
  /documents:
    get:
      tags:
        - Documents
      summary: Retrieve a paginated and filtered list of documents for a specific person.
      operationId: listDocuments
      parameters:
        - $ref: '#/components/parameters/PersonId'
        - $ref: '#/components/parameters/DocumentType'
        - $ref: '#/components/parameters/FilterFromDate'
        - $ref: '#/components/parameters/FilterToDate'
        - $ref: '#/components/parameters/PaginationPage'
      responses:
        '200':
          description: Successful retrieval of document list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentList'
        '400':
          description: Invalid query parameters provided.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Person not found (No directory exists for the personId).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'

    post:
      tags:
        - Documents
      summary: Upload a new document file for a person.
      operationId: uploadDocument
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UploadDocumentRequest'
      responses:
        '201':
          description: Document successfully uploaded and stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '400':
          description: Invalid request, file format/size, or missing required fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: Internal server error (file system write error).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'

  /documents/{documentId}:
    get:
      tags:
        - Documents
      summary: Retrieve a document file (download/preview).
      operationId: downloadDocument
      parameters:
        - $ref: '#/components/parameters/DocumentId'
      responses:
        '200':
          description: Document file stream.
          content:
            image/jpeg:
              schema:
                $ref: '#/components/schemas/BinaryFile'
        '404':
          description: Document not found at the specified path.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '400':
          description: Invalid documentId format.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'

    put:
      tags:
        - Documents
      summary: Update document metadata or replace the file.
      operationId: updateDocument
      parameters:
        - $ref: '#/components/parameters/DocumentId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UploadDocumentRequest'
      responses:
        '200':
          description: Document successfully updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '400':
          description: Invalid request, file format/size, or missing required fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: Internal server error (file system write error).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'

    delete:
      tags:
        - Documents
      summary: Permanently delete a document file from the file system.
      operationId: deleteDocument
      parameters:
        - $ref: '#/components/parameters/DocumentId'
      responses:
        '204':
          description: Document successfully deleted.
        '404':
          description: Document not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: File system deletion error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'

  /persons:
    get:
      tags:
        - Persons
      summary: List persons (used for stand-alone mode or autocomplete lookup).
      operationId: listPersons
      parameters:
        - $ref: '#/components/parameters/PersonNamePartial'
      responses:
        '200':
          description: List of persons.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Person'
        '500':
          description: Error scanning file system.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'

  /document-types:
    get:
      tags:
        - System
      summary: Get supported document types.
      operationId: getDocumentTypes
      responses:
        '200':
          description: List of supported types.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentTypeArray'

components:
  # --- PARAMETERS ---
  parameters:
    DocumentId:
      name: documentId
      in: path
      required: true
      schema:
        type: string
      description: Unique identifier of the document (alias pointing to the physical file path).
    PersonId:
      name: personId
      in: query
      required: true
      schema:
        type: string
        pattern: '^\d{1,6}$'
      description: Numeric identifier of the person (up to 6 digits).
    DocumentType:
      name: type
      in: query
      required: true
      schema:
        type: string
        enum: [DOC, MED, REF]
      description: Document category type (DOC, MED, REF). Used to target a specific subfolder.
    FilterFromDate:
      name: fromDate
      in: query
      required: false
      schema:
        type: string
        format: date
      description: Filter documents starting from this clinical date (YYYY-MM-DD), parsed from the filename.
    FilterToDate:
      name: toDate
      in: query
      required: false
      schema:
        type: string
        format: date
      description: Filter documents up to this clinical date (YYYY-MM-DD), parsed from the filename.
    PaginationPage:
      name: page
      in: query
      required: false
      schema:
        type: integer
        default: 1
      description: Page number for pagination.
    PersonNamePartial:
      name: name
      in: query
      required: false
      schema:
        type: string
      description: Partial name for filtering (used when proxied by OH-API for OH data lookup).
    PluginId:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: Unique identifier of the plugin resource ('smartdoc-core.js').


  schemas:
    # --- UTILITY SCHEMAS ---
    BinaryFile:
      type: string
      format: binary
      description: Represents raw binary file content (JPEG, JavaScript bundle).

    DocumentTypeArray:
      type: array
      items:
        type: string
        enum: [DOC, MED, REF]
      description: List of supported document types.

    # --- REQUEST SCHEMAS ---
    UploadDocumentRequest:
      type: object
      description: Fields required for document upload via multipart/form-data.
      properties:
        document:
          allOf:
            - $ref: '#/components/schemas/BinaryFile'
          description: The file to upload (JPG).
        personId:
          type: string
          pattern: '^\d{1,6}$'
          description: Numeric identifier of the person.
        type:
          type: string
          enum: [DOC, MED, REF]
          description: Document category type.
        documentDate:
          type: string
          format: date
          description: The clinical date associated with the document (YYYY-MM-DD). Used for the file naming timestamp.
        description:
          type: string
          description: Optional description to be included in the filename.
      required:
        - document
        - personId
        - type

    # --- RESPONSE SCHEMAS ---
    DocumentList:
      type: object
      description: Structure for a paginated list of documents.
      properties:
        totalCount:
          type: integer
          description: Total number of documents matching the filter.
        pageSize:
          type: integer
        pageNumber:
          type: integer
        documents:
          type: array
          items:
            $ref: '#/components/schemas/Document'

    Document:
      type: object
      description: Detailed information about a single document.
      properties:
        documentId:
          type: string
          description: A system-generated unique ID or path alias for retrieval.
        fileName:
          type: string
          description: The full file name in the storage (YYYYMMDD_HHmmss_...).
        personId:
          type: string
        type:
          type: string
          enum: [DOC, MED, REF]
        creationDate:
          type: string
          format: date-time
          description: Timestamp when the document was uploaded/stored.
        documentDate:
          type: string
          format: date
          description: The clinical date extracted from the file name.

    Person:
      type: object
      description: Person identification data.
      properties:
        personId:
          type: string
          description: The person's numeric ID.
        personName:
          type: string
          nullable: true
          description: Person's name (available when integrated with OH).

    Problem:
      type: object
      description: Standardized error format following RFC 7807 (Problem Details for HTTP APIs).
      properties:
        type:
          type: string
          format: uri
          description: A URI reference that identifies the problem type.
          example: "/problems/invalid-parameter"
        title:
          type: string
          description: A short, human-readable summary of the problem type.
          example: "Validation Error"
        status:
          type: integer
          description: The HTTP status code generated by the origin server for this occurrence of the problem.
          example: 400
        detail:
          type: string
          description: A human-readable explanation specific to this occurrence of the problem.
          example: "Required field 'personId' is missing or malformed."
        instance:
          type: string
          format: uri
          description: A URI reference that identifies the specific occurrence of the problem.
        traceId:
          type: string
          format: uuid
          description: A unique identifier for the error occurrence, useful for tracing.
          example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"

  securitySchemes:
    basicAuth:
      type: http
      scheme: basic

security:
  - basicAuth: [ ]
