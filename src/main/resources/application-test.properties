# Server
server.port                                                   = 8042

# Datasource
spring.datasource.url                                         = jdbc:h2:mem:smartdoc;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName                             = org.h2.Driver
spring.datasource.username                                    = user
spring.datasource.password                                    = password
spring.jpa.database-platform                                  = org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.type.preferred_uuid_jdbc_type = VARCHAR
spring.flyway.enabled                                         = false
spring.jpa.show-sql                                           = false
spring.jpa.properties.hibernate.format_sql                    = false
spring.jpa.hibernate.ddl-auto                                 = create-drop

# Logging
logging.level.org.hibernate.SQL                               = DEBUG
logging.level.org.hibernate.orm.jdbc.bind                     = TRACE

# Uploads
uploads.paths.base-dir                                        = src/test/resources/static/
uploads.paths.videos                                          = videos
uploads.paths.images                                          = images
uploads.paths.documents                                       = documents
uploads.storage.max-items                                     = 1000
