post:
  tags:
    - Persons
  summary: Deactivate an active person.
  operationId: deactivatePerson
  parameters:
    - $ref: ../components/parameters/Id.yaml
  responses:
    '200':
      description: Person deactivated.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Person.yaml
    '400':
      description: Person not deleted.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Problem.yaml
    '404':
      description: Person not found.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Problem.yaml
    '403':
      description: Forbidden (insufficient permissions).
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Problem.yaml