name: SD-BE CI

# Trigger the pipeline on pull requests to develop/main and on pushes to these branches
on: [push, pull_request]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the code from the repo
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Set up Java JDK 21
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Step 3: Cache Maven dependencies to speed up subsequent builds
      - name: Cache Maven repository
        uses: actions/cache@v3
        with:
          path: ~/.m2/repository
          key: maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: maven-

      # Step 4: Install project dependencies without running tests
      - name: Install dependencies
        run: mvn -B install -DskipTests

      # Step 5: Build the project (compile and package)
      - name: Build project
        run: mvn -B clean package -DskipTests

      # Step 6: Run unit tests to verify code correctness
      - name: Run tests
        run: mvn test

      # Deployment steps are left open for now.
      # Once the deployment method is defined, add a separate job here.
