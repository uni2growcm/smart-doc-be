name: SD-BE CI

# Trigger the pipeline on pull requests to develop/main and on pushes to these branches
on: [push, pull_request]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the code from the repo
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Set up Java JDK 25
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      # Step 3: Set up Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # Step 4: Build the project (compile and package)
      - name: Build project
        run: gradle build -x test

      # Step 5: Run unit tests to verify code correctness
      - name: Run tests
        run: gradle test
